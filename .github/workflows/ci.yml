name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate court coordinates
        run: node .github/scripts/validate-court.mjs

      - name: Smoke test — verify bundle loads
        run: |
          ls dist/index.html && ls dist/assets/index-*.js && echo "✅ Bundle OK"
